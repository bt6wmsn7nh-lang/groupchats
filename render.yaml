databases:
  - name: frxsty-messenger-db
    plan: free
    databaseName: frxsty_messenger
    user: frxsty_messenger

services:
  - type: web
    name: frxsty-messenger
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: frxsty-messenger-db
          property: connectionString
